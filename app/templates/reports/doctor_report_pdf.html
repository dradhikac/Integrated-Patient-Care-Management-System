<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor Roster & Performance Report - IPCMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body { background-color: #fff; font-family: 'Segoe UI', Arial, sans-serif; }
    .report-card { max-width: 900px; margin: 20px auto; padding: 30px; }
    .report-header { border-bottom: 2px solid #008080; padding-bottom: 15px; margin-bottom: 20px; }
    .report-title { color: #008080; font-weight: 800; font-size: 22px; text-transform: uppercase; }
    @media print { .no-print { display: none !important; } .report-card { padding: 0; margin: 0; } }
  </style>
</head>
<body>

<div class="no-print text-center my-3">
  <button onclick="window.print()" class="btn btn-primary shadow">🖨️ Print / Save as PDF</button>
</div>

<div class="report-card">
  <div class="report-header d-flex justify-content-between align-items-center">
    <div>
      <div class="report-title">🏥 IPCMS HEALTHCARE HOSPITAL</div>
      <small class="text-muted">Doctor Roster & OPD Performance Summary</small><br>
      <small class="text-muted">Generated: {{ now.strftime('%d %B %Y, %I:%M %p') }}</small>
    </div>
    <div class="text-end">
      <span class="badge bg-info text-dark fs-6">DOCTOR REPORT</span>
    </div>
  </div>

  <table class="table table-bordered align-middle">
    <thead class="table-light">
      <tr>
        <th>#</th>
        <th>Doctor Code</th>
        <th>Doctor Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      {% for d in data %}
      <tr>
        <td>{{ loop.index }}</td>
        <td><code>{{ d.user_code }}</code></td>
        <td class="fw-bold">{{ d.name }}</td>
        <td>{{ d.email }}</td>
        <td><span class="badge bg-secondary">{{ d.role.name }}</span></td>
        <td><span class="badge bg-success">Active</span></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

</body>
</html>
